services:
  db:
    image: mysql:8.4
    container_name: store_management_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?请配置DB_NAME}
      MYSQL_USER: ${DB_USER:?请配置DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: store_management_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_management_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请配置DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?请配置DJANGO_ALLOWED_HOSTS}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-false}
      DB_NAME: ${DB_NAME:?请配置DB_NAME}
      DB_USER: ${DB_USER:?请配置DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?请配置DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    ports:
      - "127.0.0.1:18000:8000"
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py sync_permissions &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  mysql_data:
  redis_data: