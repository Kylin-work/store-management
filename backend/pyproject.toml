[project]
name = "backend"
version = "0.1.0"
description = "门店会员管理系统后端"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "mysqlclient>=2.3.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
exclude = ["*/migrations/*"]

# 把 pytest 配置改成 TOML 格式并加上引号
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
