name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: store_management
          MYSQL_USER: dj
          MYSQL_PASSWORD: dj_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: store_management
      DB_USER: dj
      DB_PASSWORD: dj_password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Import MySQL timezone tables and grant test privileges
        run: |
          # 导入时区表
          docker exec $(docker ps -q --filter "ancestor=mysql:8.4") \
            mysql_tzinfo_to_sql /usr/share/zoneinfo | \
            docker exec -i $(docker ps -q --filter "ancestor=mysql:8.4") \
            mysql -u root -proot mysql || true

          # 给 dj 用户授权，允许它创建和删除 test_store_management
          docker exec $(docker ps -q --filter "ancestor=mysql:8.4") \
            mysql -u root -proot -e "GRANT ALL PRIVILEGES ON \`test_store_management\`.* TO 'dj'@'%'; GRANT CREATE, DROP ON *.* TO 'dj'@'%'; FLUSH PRIVILEGES;"

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests
        working-directory: backend
        run: uv run python manage.py test -v 2

      - name: Run coverage
        working-directory: backend
        run: |
          uv run coverage run manage.py test
          uv run coverage report -m
